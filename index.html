<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>SpaceLift · GitHub → Vercel Loop Test</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --panel:#111d30; --line:rgba(190,210,240,.14); --muted:#9aa9bf; --mint:#8ee6c0; --blue:#91b9ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px; color:#f4f7fb; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 15% 15%,rgba(76,129,195,.20),transparent 36%),radial-gradient(ellipse at 85% 85%,rgba(71,190,153,.13),transparent 34%),var(--bg); }
    main { width:min(720px,100%); }
    .eyebrow { display:inline-flex; align-items:center; gap:9px; padding:8px 12px; border:1px solid var(--line); border-radius:999px; color:#c8d5e8; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    .dot { width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 14px var(--mint); }
    h1 { margin:26px 0 12px; font-size:clamp(38px,8vw,68px); line-height:1.02; letter-spacing:-.055em; }
    h1 span { color:var(--mint); }
    .intro { max-width:560px; margin:0; color:var(--muted); font-size:16px; line-height:1.8; }
    .panel { margin-top:34px; padding:24px; border:1px solid var(--line); border-radius:22px; background:linear-gradient(145deg,rgba(25,42,65,.92),rgba(14,25,42,.92)); box-shadow:0 24px 80px rgba(0,0,0,.24); }
    .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .step { min-height:104px; padding:15px; border:1px solid var(--line); border-radius:15px; background:rgba(255,255,255,.025); }
    .step b { display:block; margin-bottom:10px; color:var(--mint); font-size:12px; letter-spacing:.08em; }
    .step strong { font-size:15px; font-weight:600; }
    .status { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:22px; padding-top:18px; border-top:1px solid var(--line); }
    .status-label { color:var(--muted); font-size:13px; }
    #status { color:var(--mint); font-size:14px; font-weight:650; }
    button { border:0; border-radius:999px; padding:12px 18px; color:#102019; background:var(--mint); font:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:transform .18s ease,filter .18s ease; }
    button:hover { transform:translateY(-2px); filter:brightness(1.06); }
    button:active { transform:translateY(0); }
    .foot { margin-top:18px; color:#718199; font-size:12px; text-align:center; }
    @media (max-width:560px) { body { padding:20px; } .steps { grid-template-columns:1fr; } .step { min-height:auto; } .status { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow"><span class="dot"></span> Deployment pipeline · live test</div>
    <h1>Ship it.<br><span>See it live.</span></h1>
    <p class="intro">这是一个最小化的端到端测试页面。我们要验证：ChatGPT 写代码 → GitHub 保存提交 → Vercel 自动构建并发布。</p>
    <section class="panel" aria-label="Deployment pipeline test">
      <div class="steps">
        <div class="step"><b>01 / CREATE</b><strong>ChatGPT<br>生成网页代码</strong></div>
        <div class="step"><b>02 / COMMIT</b><strong>GitHub<br>保存版本</strong></div>
        <div class="step"><b>03 / DEPLOY</b><strong>Vercel<br>自动上线</strong></div>
      </div>
      <div class="status">
        <div><div class="status-label">页面交互测试</div><div id="status" role="status">等待点击验证</div></div>
        <button id="testButton" type="button">测试页面交互 ↗</button>
      </div>
    </section>
    <p class="foot">SpaceLift · GitHub → Vercel → Live Website</p>
  </main>
  <script>
    const button = document.querySelector("#testButton");
    const status = document.querySelector("#status");
    button.addEventListener("click", () => {
      status.textContent = "交互正常 · " + new Date().toLocaleTimeString("zh-CN");
      button.textContent = "测试通过 ✓";
    });
  </script>
</body>
</html>
